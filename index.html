<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14203a">
<link rel="manifest" href="manifest.json">
<script src="capacitor.js"></script>
<title>CTFL 합격노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 모바일 단일 컬럼 공부 앱. OMR 답안지의 붉은 인쇄선과 검은 마킹을 모티프로, 장마다 고유 색 */
:root{
  --bg:#edf1f4; --surface:#ffffff; --surface2:#f6f8fa; --ink:#14203a; --muted:#5d6a7e; --line:#d9e0e7;
  --accent:#e5405e; --accent-soft:#fde6ea; --hero:#14203a; --hero-fg:#f3f5f9; --hero-muted:#a9b4c8;
  --mark:#14203a; --mark-fg:#ffffff;
  --ok:#0d9874; --ok-soft:#daf3ec; --warn:#c97a06; --warn-soft:#fcefd8; --bad:#d4500f; --bad-soft:#fde8dc;
  --c1:#3a6ee0; --c2:#0d9874; --c3:#8556e8; --c4:#e5405e; --c5:#c97a06; --c6:#0b8bb0;
  --h0:#e3e8ed; --h1:#f8c3cd; --h2:#ee7d93; --h3:#c92c4a;
  --f-display:"Do Hyeon","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e121a; --surface:#171d28; --surface2:#1d2431; --ink:#e8ecf3; --muted:#9ba5b8; --line:#2a3242;
  --accent:#ff6b85; --accent-soft:#3b1d27; --hero:#1f2a40; --hero-fg:#f3f5f9; --hero-muted:#a9b4c8;
  --mark:#e8ecf3; --mark-fg:#0e121a;
  --ok:#45c99d; --ok-soft:#14302a; --warn:#f0a83a; --warn-soft:#3a2c14; --bad:#ff8a4c; --bad-soft:#3b2318;
  --c1:#7aa2ff; --c2:#45c99d; --c3:#ad8cff; --c4:#ff6b85; --c5:#f0a83a; --c6:#4cc3e6;
  --h0:#222a38; --h1:#5a2433; --h2:#a33a55; --h3:#ff6b85; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e121a; --surface:#171d28; --surface2:#1d2431; --ink:#e8ecf3; --muted:#9ba5b8; --line:#2a3242;
  --accent:#ff6b85; --accent-soft:#3b1d27; --hero:#1f2a40; --hero-fg:#f3f5f9; --hero-muted:#a9b4c8;
  --mark:#e8ecf3; --mark-fg:#0e121a;
  --ok:#45c99d; --ok-soft:#14302a; --warn:#f0a83a; --warn-soft:#3a2c14; --bad:#ff8a4c; --bad-soft:#3b2318;
  --c1:#7aa2ff; --c2:#45c99d; --c3:#ad8cff; --c4:#ff6b85; --c5:#f0a83a; --c6:#4cc3e6;
  --h0:#222a38; --h1:#5a2433; --h2:#a33a55; --h3:#ff6b85; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:18px 118px}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0;font-weight:400}
h1{font-family:var(--f-display);font-size:1.9rem;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-size:1.45rem}
h3{font-family:var(--f-body);font-weight:700;font-size:1.04rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.87rem} .tiny{font-size:.76rem}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.tight{gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:0 1px 0 var(--line)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:4px 2px}
.top .label{color:var(--accent)}
/* 버튼 */
.btn{appearance:none;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:13px 18px;border-radius:12px;cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.dark{background:var(--mark);color:var(--mark-fg)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:8px 13px;min-height:38px;font-size:.88rem;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
:is(.btn,.chip,.opt,.cell,.tab,.tile,.flip,.chap-row,input,textarea,summary):focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{appearance:none;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;padding:8px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--mark);color:var(--mark-fg);box-shadow:none}
/* 탭바 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:.74rem;font-weight:600;padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.tab .ic{width:26px;height:26px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.66rem;font-weight:600}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ic{background:var(--accent);border-color:var(--accent);color:#fff}
/* 홈 히어로 */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:22px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:2px dashed rgba(255,255,255,.12)}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-family:var(--f-display);font-size:1.9rem;font-weight:400}
.ring .v span{font-size:.68rem;color:var(--hero-muted)}
.hero .dd{font-family:var(--f-display);font-size:2.3rem;line-height:1}
.hero .sub{color:var(--hero-muted);font-size:.86rem}
.hero input[type=date]{background:rgba(255,255,255,.08);color:var(--hero-fg);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:6px 8px;font:inherit;font-size:.85rem;color-scheme:dark;max-width:100%}
.hero .pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
/* 목표 */
.goal{display:flex;flex-direction:column;gap:8px}
.goalbar{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.goalbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,color-mix(in srgb,var(--accent) 80%,#fff) 8px 16px);border-radius:6px}
/* 퀵 타일 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{appearance:none;border:0;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;box-shadow:0 1px 0 var(--line);min-width:0}
.tile .sq{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.8rem}
.tile b{font-size:.98rem}
.tile span{font-size:.8rem;color:var(--muted)}
/* 장 진행 */
.chaps{display:flex;flex-direction:column;gap:12px}
.chap-line{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center}
.dot{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;font-weight:600;grid-row:span 2}
.track{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;grid-column:2/4;box-shadow:inset 0 0 0 1px var(--line)}
.track i{display:block;height:100%;background:var(--c);border-radius:4px}
/* 히트맵 */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--h0);display:block}
.heat i.l1{background:var(--h1)} .heat i.l2{background:var(--h2)} .heat i.l3{background:var(--h3)}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:4px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* 차트 */
.spark{display:flex;align-items:flex-end;gap:6px;height:90px;position:relative;padding-top:6px}
.spark .b{flex:1;background:var(--c4);border-radius:6px 6px 2px 2px;position:relative;min-width:0}
.spark .b.fail{background:var(--line)}
.spark .b span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.spark .pass-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ok)}
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info div{background:var(--surface2);border-radius:12px;padding:12px}
.info b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:400;line-height:1.1}
/* 개념 */
details.chap{background:var(--surface);border-radius:var(--r);box-shadow:0 1px 0 var(--line);overflow:hidden}
details.chap>summary{list-style:none;cursor:pointer;padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border-left:5px solid var(--c)}
details.chap>summary::-webkit-details-marker{display:none}
.num{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);display:grid;place-items:center;font-family:var(--f-display);font-size:1.25rem}
.concepts{padding:4px 14px 16px;display:flex;flex-direction:column;gap:12px}
.concept{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface2)}
.concept.done{box-shadow:inset 0 0 0 2px var(--ok)}
.box{padding:10px 12px;border-radius:10px;font-size:.94rem;background:var(--surface)}
.box b{display:block;font-size:.72rem;letter-spacing:.06em;margin-bottom:3px;font-family:var(--f-mono);text-transform:uppercase}
.box.game b{color:var(--c4)} .box.tip b{color:var(--ok)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.92rem;font-weight:600;color:var(--muted)}
.check input{width:20px;height:20px;accent-color:var(--ok)}
.concept.done .check{color:var(--ok)}
/* 문제 */
.qcard{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 0 var(--line);position:relative}
.qcard::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--accent))}
.qtext{font-size:1.06rem;font-weight:600;line-height:1.55}
pre.code{margin:0;background:var(--surface2);border-radius:10px;padding:12px;font-family:var(--f-mono);font-size:.86rem;overflow-x:auto;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface2);border:0;box-shadow:inset 0 0 0 1.5px transparent;border-radius:12px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;cursor:pointer}
.bub{width:28px;height:28px;border:2px solid var(--accent);color:var(--accent);border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.84rem;background:var(--surface)}
.opt.sel{box-shadow:inset 0 0 0 1.5px var(--mark)}
.opt.sel .bub{background:var(--mark);border-color:var(--mark);color:var(--mark-fg)}
.opt.right{background:var(--ok-soft);box-shadow:inset 0 0 0 1.5px var(--ok)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-soft);box-shadow:inset 0 0 0 1.5px var(--bad)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.explain{border-top:1.5px dashed var(--line);padding-top:12px}
.verdict{font-family:var(--f-display);font-size:1.3rem}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
.star{appearance:none;border:0;background:none;font:inherit;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:8px;display:inline-flex;gap:4px;align-items:center}
.star[aria-pressed="true"]{color:var(--warn);background:var(--warn-soft)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);color:var(--c,var(--accent))}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{appearance:none;border:0;font:inherit;color:var(--ink);text-align:left;background:var(--surface);border-radius:14px;padding:14px;box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.mode[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.mode b{font-size:.95rem} .mode span{font-size:.78rem;color:var(--muted)}
/* 모의고사 */
.timer{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;background:var(--surface);padding:6px 12px;border-radius:10px}
.timer.warn{color:var(--bad);background:var(--bad-soft)}
.grid40{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.cell{appearance:none;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:50%;aspect-ratio:1;max-width:100%;font-family:var(--f-mono);font-size:.66rem;font-weight:600;cursor:pointer;padding:0}
.cell.ans{background:var(--mark);border-color:var(--mark);color:var(--mark-fg)}
.cell.cur{outline:2px solid var(--ink);outline-offset:2px}
.cell.flag{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.score{font-family:var(--f-display);font-size:3.6rem;line-height:1}
.stamp{display:inline-block;border:3px solid currentColor;padding:2px 14px;border-radius:8px;font-family:var(--f-display);font-size:1.6rem;transform:rotate(-6deg)}
.stamp.pass{color:var(--ok)} .stamp.fail{color:var(--bad)}
.confirm{background:var(--bad-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;padding:32px 16px;border:2px dashed var(--line);border-radius:var(--r);align-items:center}
/* 플래시카드 */
.flip{appearance:none;border:0;padding:0;background:none;font:inherit;color:inherit;width:100%;perspective:1200px;cursor:pointer;display:block}
.flip .inner{position:relative;min-height:260px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:left}
.face.front{background:var(--surface);box-shadow:0 1px 0 var(--line),inset 0 0 0 1.5px var(--line)}
.face.back{background:var(--hero);color:var(--hero-fg);transform:rotateY(180deg)}
.face .term{font-family:var(--f-display);font-size:2.1rem;line-height:1.15}
.face .en{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.face.back .en{color:var(--hero-muted)}
.face .def{font-size:1.08rem;font-weight:500}
.face .ex{font-size:.88rem;color:var(--hero-muted);border-top:1px dashed rgba(255,255,255,.2);padding-top:8px}
.face .hint{position:absolute;bottom:14px;left:22px;font-size:.76rem;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{flex-direction:column;gap:0;line-height:1.2;font-size:.92rem}
.rate .btn small{font-weight:500;font-size:.7rem;opacity:.85}
.btn.r0{background:var(--bad)} .btn.r1{background:var(--warn)} .btn.r2{background:var(--ok)}
.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.boxes div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.boxes b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:400}
.search{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);color:var(--ink)}
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{background:var(--surface);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;border-left:4px solid var(--c)}
.titem .lv{grid-row:span 2;align-self:center;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:.78rem;padding:10px;border-radius:10px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface2);color:var(--ink);resize:vertical}
details.more>summary{cursor:pointer;font-weight:700;list-style:none;padding:4px 0}
details.more>summary::-webkit-details-marker{display:none}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--mark);color:var(--mark-fg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;z-index:20;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:380px){.grid40{grid-template-columns:repeat(8,1fr)}.hero{grid-template-columns:1fr}.hero .dd{font-size:2rem}}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.mode,.tile{transition:background-color .15s,box-shadow .15s}#toast{transition:opacity .2s,transform .2s}.goalbar i,.track i{transition:width .5s}}
@media (prefers-reduced-motion:reduce){.flip .inner{transition:none}}
.neg{color:var(--accent);font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.multi{display:inline-flex;align-self:flex-start;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.opt.sq .bub{border-radius:7px}
.opt.miss{box-shadow:inset 0 0 0 1.5px var(--ok)}
.opt.miss .bub{border-color:var(--ok);color:var(--ok)}
.whys{background:var(--surface2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.whys ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.whys li.mine{color:var(--bad)}
.whys .tag{font-size:.7rem;font-weight:700;background:var(--bad-soft);color:var(--bad);padding:1px 6px;border-radius:6px;white-space:nowrap}
.weak{display:flex;flex-direction:column;gap:8px}
.weakrow{appearance:none;border:0;font:inherit;color:var(--ink);background:var(--surface2);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;cursor:pointer;border-left:4px solid var(--c)}
.concept.flash{animation:flash 1.8s ease}
@keyframes flash{0%,45%{box-shadow:inset 0 0 0 3px var(--accent)}100%{box-shadow:inset 0 0 0 0 transparent}}
.checkcard{appearance:none;border:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%}
.checkcard .sq{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);display:grid;place-items:center;font-weight:700}
.ck{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;cursor:pointer;font-size:.95rem}
.ck input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok)}
.ck.todo input:checked+span{color:var(--muted);text-decoration:line-through}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.94rem}
.cram{background:var(--surface);border-radius:12px;padding:12px 14px;border-left:4px solid var(--accent)}
.cram b{display:block;font-size:.85rem;color:var(--accent);margin-bottom:2px}
.cram p{font-size:.92rem;line-height:1.65}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;cursor:pointer;transition:background .2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
input[type=time]{font:inherit;padding:6px 10px;border-radius:10px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);color:var(--ink)}
.mode:last-child:nth-child(odd){grid-column:1/-1}
.top{flex-wrap:wrap}
.timer#qtimer{font-size:1rem}

<script>
const CH=[
{n:1,t:"테스팅의 기초",q:8,c:[
{id:"1-1",term:"테스팅이란?",easy:"소프트웨어를 직접 실행해 보거나, 문서·코드를 읽어 보면서 품질을 평가하고 결함을 찾는 모든 활동입니다.\n실행하는 것(동적 테스팅)뿐 아니라 읽고 검토하는 것(정적 테스팅)도 테스팅에 들어갑니다.",game:"맞고 게임을 직접 쳐보는 것도 테스팅이고, 기획서를 읽다가 '이 점수 규칙 이상한데?' 하고 찾는 것도 테스팅입니다.",tip:"'테스팅 = 실행만'이라는 보기는 틀린 보기입니다."},
{id:"1-2",term:"테스팅의 목적",easy:"• 결함 찾기\n• 품질 수준에 대한 정보 주기\n• 리스크(나쁜 일이 생길 가능성) 줄이기\n• 요구사항대로 만들었는지 확인하기\n• 계약·법 기준을 지키는지 확인하기\n• 이해관계자에게 믿음 주기",game:"출시 전 '이번 빌드는 결제 쪽 리스크가 높다'고 보고하는 것도 테스팅의 목적(정보 제공)에 해당합니다.",tip:"'결함을 직접 고치는 것'은 테스팅의 목적이 아닙니다. 그건 디버깅입니다."},
{id:"1-3",term:"테스팅 vs 디버깅",easy:"테스팅: 장애를 일으키거나 결함을 찾아내는 일.\n디버깅: 장애의 원인을 찾아내고 분석해서 고치는 일 (주로 개발자).",game:"QA가 '피박 계산이 틀려요' 이슈 등록 → 테스팅.\n개발자가 원인 코드를 찾아 수정 → 디버깅.\nQA가 수정됐는지 다시 확인 → 다시 테스팅(확인 테스트).",tip:"순서 문제가 나오면: 테스팅 → 디버깅 → 확인 테스팅."},
{id:"1-4",term:"오류 → 결함 → 장애",easy:"오류(error, 실수): 사람이 저지른 실수.\n결함(defect, 버그): 그 실수 때문에 코드나 문서에 남은 흠.\n장애(failure): 결함이 있는 부분이 실행돼서 실제로 잘못된 결과가 나온 것.\n근본 원인(root cause): 실수가 생긴 진짜 이유 (예: 시간 압박, 요구사항이 애매함).",game:"기획자가 '광박' 규칙을 잘못 이해함(오류) → 점수 계산식이 틀림(결함) → 실제 판에서 점수가 틀리게 나옴(장애).",tip:"결함이 있어도 그 코드가 실행되지 않으면 장애는 생기지 않습니다. 또 방사선·전자기장 같은 환경 때문에 장애가 생기기도 합니다."},
{id:"1-5",term:"QA(품질 보증) vs 테스팅",easy:"QA: 일하는 방식(프로세스)을 좋게 만들어 문제를 '예방'하는 활동.\n테스팅: 만들어진 제품을 검사해서 문제를 '찾아 고치게' 하는 활동. 품질 통제(QC)의 한 형태입니다.",game:"'버그 등록 양식과 검수 절차를 팀 표준으로 만든다' → QA.\n'오늘 빌드를 받아서 검증한다' → 테스팅.",tip:"QA = 프로세스 중심·예방 / 테스팅 = 제품 중심·교정. 이 짝을 외우세요."},
{id:"1-6",term:"테스팅 7원칙",easy:"① 테스팅은 결함이 '있다'는 걸 보여줄 뿐, '없다'는 걸 증명하진 못한다.\n② 완벽한(모든 경우) 테스팅은 불가능하다.\n③ 일찍 테스트할수록 시간과 돈을 아낀다.\n④ 결함은 몇몇 곳에 몰려 있다(결함 집중).\n⑤ 같은 테스트만 반복하면 효과가 떨어진다(살충제 패러독스).\n⑥ 테스팅은 상황(정황)에 따라 다르다.\n⑦ 결함이 없어도 사용자가 원하는 게 아니면 실패다(오류 부재의 궤변).",game:"버그 대부분이 '정산·결제' 모듈에서만 나온다 → ④ 결함 집중.\n몇 달 같은 리그레션 TC만 돌렸더니 새 버그가 안 나온다 → ⑤ 테스트를 새로 고쳐야 함.",tip:"상황을 주고 '어느 원칙인가?'를 묻는 문제가 매우 자주 나옵니다."},
{id:"1-7",term:"테스트 활동 7가지",easy:"1. 계획: 목표와 방법 정하기\n2. 모니터링과 제어: 계획대로 가는지 보고, 아니면 조정하기\n3. 분석: '무엇을' 테스트할지 (테스트 조건)\n4. 설계: '어떻게' 테스트할지 (테스트 케이스, 데이터)\n5. 구현: 실행 준비물 만들기 (테스트 절차, 스위트, 환경)\n6. 실행: 돌리고 결과 비교, 결함 보고\n7. 완료: 마무리 보고서, 테스트웨어 보관, 회고",game:"'이번 업데이트에서 새 이벤트 보상 지급을 확인해야 한다' → 분석.\n'보상 지급 조건별 TC 5개 작성' → 설계.",tip:"분석 = 무엇을(What), 설계 = 어떻게(How). 시험 단골입니다."},
{id:"1-8",term:"테스트웨어와 추적성",easy:"테스트웨어: 테스트하면서 만든 모든 산출물 (계획서, 테스트 케이스, 데이터, 스크립트, 보고서 등).\n추적성: 요구사항 ↔ 테스트 케이스 ↔ 실행 결과 ↔ 결함을 서로 연결해 두는 것.\n추적성 덕분에 커버리지(얼마나 확인했는지)를 평가하고, 요구사항이 바뀌었을 때 어떤 테스트를 다시 해야 하는지 알 수 있습니다.",game:"'기획서 3번 항목이 바뀌었는데 어떤 TC를 다시 돌려야 하지?'에 바로 답할 수 있게 해주는 게 추적성입니다.",tip:"추적성의 이점: 커버리지 평가, 변경 영향 분석, 감사 대응, 보고서 이해도 향상."},
{id:"1-9",term:"역할·전체 팀 접근법·독립성",easy:"테스트 관리 역할: 계획, 모니터링·제어, 완료를 책임짐.\n테스팅 역할: 분석, 설계, 구현, 실행을 담당.\n전체 팀 접근법: 품질은 테스터만이 아니라 팀 모두의 책임.\n독립성: 만든 사람과 다른 사람이 테스트할수록 다른 관점으로 결함을 찾기 쉬움.",game:"개발자 셀프 테스트보다 QA팀이 볼 때 새로운 버그가 더 잘 보이는 것 = 독립성의 장점.",tip:"독립성의 단점: 개발팀과 고립됨, 소통 문제, 개발자가 '품질은 QA가 알아서'라고 생각하게 됨, QA가 병목으로 여겨짐."}
]},
{n:2,t:"SDLC와 테스팅",q:6,c:[
{id:"2-1",term:"개발 과정 전반의 좋은 테스트 습관",easy:"SDLC는 '소프트웨어를 기획부터 출시·유지보수까지 만드는 전체 과정'이라는 뜻입니다.\n어떤 개발 방식이든 공통으로 좋은 습관:\n• 개발 활동마다 짝이 되는 테스트 활동이 있다\n• 테스트 레벨마다 목표가 다르다\n• 테스트 분석·설계는 해당 개발 단계가 시작될 때 함께 시작한다\n• 테스터는 문서 초안이 나오자마자 리뷰에 참여한다",game:"기획서 초안이 나왔을 때부터 QA가 리뷰에 들어가는 것.",tip:"'테스트는 코딩이 끝난 뒤에 시작한다'는 틀린 보기."},
{id:"2-2",term:"테스트 먼저 하는 개발: TDD·ATDD·BDD",easy:"TDD: 테스트를 먼저 짜고, 그 테스트를 통과하도록 코드를 작성하고, 코드를 다듬는다(리팩터링). 주로 개발자, 작은 단위.\nATDD: 고객·개발·테스터가 함께 정한 '인수 조건'에서 테스트를 먼저 만든다.\nBDD: 'Given(이런 상황에서) / When(이걸 하면) / Then(이렇게 된다)' 같은 쉬운 문장으로 원하는 동작을 적고, 그걸 테스트로 쓴다.",game:"Given 판돈이 0원인 유저가 / When 게임방에 입장하면 / Then '충전하세요' 안내가 뜬다 → BDD 형식.",tip:"Given/When/Then이 보이면 BDD."},
{id:"2-3",term:"DevOps·시프트 레프트·회고",easy:"DevOps: 개발팀과 운영팀이 함께 일하며, 자동으로 빌드·테스트·배포(CI/CD)하는 방식. 빠른 피드백이 장점, 자동화 환경 구축 비용이 단점.\n시프트 레프트: 테스트를 더 '앞쪽(일찍)'으로 당기는 것. 예: 요구사항 리뷰, 코드 올리기 전 정적 분석, 코딩 전 테스트 작성.\n회고: 일이 끝난 뒤 '잘된 점·아쉬운 점·개선할 점'을 팀이 같이 돌아보는 것.",game:"빌드가 올라오면 자동으로 기본 플레이 테스트가 돌아가는 파이프라인 = CI/CD.",tip:"시프트 레프트는 '테스트를 줄인다'가 아니라 '일찍 한다'."},
{id:"2-4",term:"테스트 레벨 5가지",easy:"1. 컴포넌트(단위) 테스트: 함수·모듈 하나씩 따로. 주로 개발자.\n2. 컴포넌트 통합 테스트: 모듈끼리 잘 연결되는지.\n3. 시스템 테스트: 완성된 전체 시스템이 기능·비기능 모두 잘 되는지. 주로 독립 테스트팀.\n4. 시스템 통합 테스트: 우리 시스템과 외부 시스템(결제사, 플랫폼 등) 연결.\n5. 인수 테스트: 사용자·고객이 '출시해도 되겠다'를 확인. (사용자 인수, 운영 인수, 계약·규제 인수, 알파, 베타)",game:"구글 결제 연동 확인 → 시스템 통합 테스트.\n사내 직원 대상 사전 플레이 → 알파 테스트, 일부 유저 대상 CBT → 베타 테스트.",tip:"외부 시스템과의 연결 = 시스템 통합. 모듈끼리 = 컴포넌트 통합."},
{id:"2-5",term:"테스트 유형 4가지",easy:"기능 테스트: '무엇을' 하는지 (기능이 맞게 동작하나).\n비기능 테스트: '얼마나 잘' 하는지 (성능, 사용성, 보안, 호환성, 신뢰성, 유지보수성, 이식성 등).\n블랙박스 테스트: 내부 코드는 안 보고 명세(설명서) 기준으로.\n화이트박스 테스트: 내부 코드 구조를 보고.",game:"'동시 접속 1만 명에서도 2초 안에 방 입장' → 비기능(성능).\n'고도리 점수가 5점' → 기능.",tip:"모든 유형은 모든 레벨에서 할 수 있습니다."},
{id:"2-6",term:"확인 테스팅 vs 리그레션(회귀) 테스팅",easy:"확인 테스팅(재테스트): 고친 결함이 '진짜 고쳐졌는지' 확인.\n리그레션 테스팅: 고친 것 때문에 '다른 멀쩡하던 기능이 망가지지 않았는지' 확인.\n리그레션 테스트는 자주 반복되므로 자동화하기 좋은 후보입니다.",game:"'피박 계산 버그 수정' 후 피박 상황 다시 확인 → 확인 테스팅.\n같은 빌드에서 광박·고 점수도 여전히 맞는지 → 리그레션 테스팅.",tip:"영향도 분석으로 리그레션 테스트 범위를 정합니다."},
{id:"2-7",term:"유지보수 테스팅",easy:"이미 운영 중인 시스템을 바꿀 때 하는 테스트입니다.\n언제 하나요(트리거):\n• 수정: 버그 패치, 기능 개선\n• 업그레이드·마이그레이션: 다른 서버·플랫폼으로 옮기기\n• 은퇴: 서비스 종료 시 데이터 보관·복구 확인\n영향도 분석: 바꾸면 어디까지 영향이 가는지 미리 파악.",game:"서버를 새 클라우드로 이전 → 마이그레이션 → 유지보수 테스팅.",tip:"'신규 프로젝트 시작'은 유지보수 테스팅 트리거가 아닙니다."}
]},
{n:3,t:"정적 테스팅",q:4,c:[
{id:"3-1",term:"정적 테스팅 vs 동적 테스팅",easy:"정적 테스팅: 프로그램을 실행하지 않고 문서·코드를 읽어서 검사 (리뷰, 정적 분석 도구).\n동적 테스팅: 프로그램을 실제로 실행해서 검사.\n둘은 서로 보완 관계입니다.",game:"기획서 리뷰 회의 → 정적. 빌드 설치 후 플레이 → 동적.",tip:"정적 테스팅은 결함 '자체'를 찾고, 동적 테스팅은 '장애'를 일으켜서 찾습니다."},
{id:"3-2",term:"정적 테스팅의 장점",easy:"• 결함을 일찍 찾아 고치는 비용이 싸다\n• 실행으로는 찾기 어려운 결함을 찾는다: 도달할 수 없는 코드, 코딩 표준 위반, 애매하거나 빠진 요구사항, 보안 취약점, 유지보수 어려운 구조\n• 이해관계자끼리 이해를 맞출 수 있다",game:"기획서에서 '연결 끊김 시 판돈 처리 규칙이 없음'을 미리 찾는 것.",tip:"'정적 테스팅으로 응답 속도를 측정한다'는 틀린 보기."},
{id:"3-3",term:"리뷰 프로세스 5단계",easy:"1. 계획: 범위, 목표, 참여자, 종료 조건 정하기\n2. 리뷰 착수: 자료 배포, 역할 설명\n3. 개별 리뷰: 각자 읽고 이슈 찾기\n4. 이슈 소통 및 분석: 모여서 이슈 논의, 결정\n5. 수정 및 보고: 작성자가 고치고 결과 보고",game:"기획서 리뷰 일정 공지 → 문서 공유 → 각자 코멘트 → 리뷰 미팅 → 기획자 반영.",tip:"순서 문제가 나옵니다. '계획-착수-개별-소통-수정'."},
{id:"3-4",term:"리뷰 역할",easy:"관리자: 무엇을 리뷰할지 정하고 자원 제공.\n작성자: 리뷰 대상을 만들고 고치는 사람.\n중재자(퍼실리테이터): 리뷰 회의를 효과적으로 진행.\n서기: 이슈와 결정사항 기록.\n리뷰어: 실제로 검토하는 사람.\n리뷰 리더: 리뷰 전체를 책임지고 조직.",game:"리뷰 미팅에서 시간 관리하고 발언 정리하는 사람 = 중재자.",tip:"한 사람이 여러 역할을 맡을 수도 있습니다."},
{id:"3-5",term:"리뷰 유형 4가지",easy:"비공식 리뷰: 정해진 절차 없음. 동료에게 '한번 봐줘'.\n워크스루: 작성자가 주도. 교육, 합의, 아이디어 얻기 목적.\n기술 리뷰: 기술 전문가들이 기술적 결정을 함께 내림.\n인스펙션: 가장 공식적. 정해진 절차, 지표(통계) 수집. 작성자는 리뷰 리더나 서기를 맡을 수 없음.",game:"기획자가 직접 신규 이벤트 기획서를 설명하며 의견 받기 → 워크스루.",tip:"'가장 공식적', '지표 수집' → 인스펙션."},
{id:"3-6",term:"리뷰 성공 요인",easy:"• 명확한 목표와 측정 가능한 종료 조건\n• 리뷰 대상을 작은 단위로 나누기\n• 충분한 준비 시간\n• 경영진 지원\n• 리뷰를 조직 문화로 만들기\n• 참여자 교육\n• 회의 진행 잘하기",game:"200페이지 기획서를 한 번에 리뷰하지 않고 기능별로 나누는 것.",tip:"'리뷰 결과를 작성자 개인 평가에 사용'은 실패 요인입니다."}
]},
{n:4,t:"테스트 분석과 설계",q:11,c:[
{id:"4-1",term:"테스트 기법 3가지 분류",easy:"블랙박스 기법: 명세(설명서) 기반. 동등 분할, 경계값 분석, 결정 테이블, 상태 전이.\n화이트박스 기법: 코드 구조 기반. 구문 테스팅, 분기 테스팅.\n경험 기반 기법: 테스터 경험 기반. 오류 추정, 탐색적 테스팅, 체크리스트 기반.\n(+ 협업 기반 접근법: 사용자 스토리, 인수 조건, ATDD)",game:"QA 경험으로 '여기 터질 것 같은데' 찔러보기 → 경험 기반.",tip:"4장이 11문제로 가장 많이 나옵니다. 계산 문제가 여기서 나와요."},
{id:"4-2",term:"동등 분할 (EP)",easy:"입력값을 '똑같이 처리되는 묶음(파티션)'으로 나누고, 묶음마다 대표값 하나씩만 테스트하는 방법입니다.\n유효 파티션(정상 처리)과 비유효 파티션(거부되어야 함)으로 나눕니다.\n커버리지 = 테스트한 파티션 수 ÷ 전체 파티션 수.",game:"닉네임 길이 2~8자 허용이면:\n1자 이하(비유효) / 2~8자(유효) / 9자 이상(비유효) → 파티션 3개 → 최소 테스트 3개.",tip:"범위가 하나면 보통 파티션 3개 (아래 무효 / 유효 / 위 무효)."},
{id:"4-3",term:"경계값 분석 (BVA)",easy:"결함은 경계에서 잘 생기므로, 파티션의 '끝' 값을 테스트합니다.\n2값 경계값: 경계값 + 바로 바깥 이웃 1개.\n3값 경계값: 경계값 + 양쪽 이웃 2개.",game:"닉네임 2~8자:\n2값 → 1, 2, 8, 9 (4개)\n3값 → 1, 2, 3, 7, 8, 9 (6개)",tip:"범위 하나에 2값이면 4개, 3값이면 6개. 계산 문제 단골."},
{id:"4-4",term:"결정 테이블",easy:"여러 조건의 조합에 따라 결과가 달라질 때 쓰는 표입니다.\n조건이 참/거짓 두 가지씩이고 n개면 전체 조합(열) 수는 2의 n제곱입니다.\n불가능하거나 결과가 같은 조합은 합쳐서 줄일 수 있습니다.",game:"조건: VIP 회원인가? / 이벤트 기간인가? / 첫 결제인가? → 3개 → 2×2×2 = 8가지 조합.",tip:"조건 3개 → 8열, 4개 → 16열."},
{id:"4-5",term:"상태 전이 테스팅",easy:"시스템이 '상태'를 가지고 이벤트에 따라 상태가 바뀔 때 씁니다.\n모든 상태 커버리지: 모든 상태를 한 번씩 방문.\n유효 전이 커버리지(0-스위치): 모든 유효한 상태 변화를 한 번씩 실행.\n모든 전이 커버리지: 유효 전이 + 비유효 전이 시도까지 모두.",game:"로그아웃 →(로그인)→ 로비 →(방 입장)→ 게임 중 →(판 종료)→ 로비.\n이 한 흐름으로 상태 3개를 모두 방문 → 모든 상태 커버리지 달성.",tip:"유효 전이 커버리지 100%를 달성하면 모든 상태 커버리지도 100% 달성됩니다."},
{id:"4-6",term:"구문 테스팅과 분기 테스팅",easy:"구문(statement) 커버리지: 실행된 코드 줄 수 ÷ 전체 실행 가능한 코드 줄 수.\n분기(branch) 커버리지: 실행된 갈림길 수 ÷ 전체 갈림길 수. IF문은 '참' 길과 '거짓' 길 두 개.\n분기 100%면 구문 100%도 보장. 반대는 보장 안 됨.",game:"IF 판돈 > 0 THEN 게임 시작 (ELSE 없음)\n구문 100% → 판돈 > 0 하나면 됨 (1개)\n분기 100% → 판돈 > 0, 판돈 = 0 둘 다 필요 (2개)",tip:"'구문 100%면 분기 100%' → 틀린 보기!"},
{id:"4-7",term:"경험 기반: 오류 추정·탐색적·체크리스트",easy:"오류 추정: 과거 결함, 개발자가 흔히 하는 실수를 바탕으로 결함을 예상해 테스트. (결함 공격: 예상 결함 목록을 만들어 하나씩 공격)\n탐색적 테스팅: 테스트를 설계·실행·평가를 동시에. '테스트 차터(목표 메모)'와 정해진 시간으로 하는 세션 기반이 많음. 명세가 부족하거나 시간이 없을 때 효과적.\n체크리스트 기반: 경험·지식으로 만든 확인 목록으로 테스트. 주기적으로 업데이트해야 함.",game:"'60분 동안 결제 화면에서 네트워크 끊김 위주로 탐색' → 테스트 차터를 가진 세션 기반 탐색적 테스팅.",tip:"경험 기반 기법은 테스터 실력에 따라 결과가 크게 달라집니다."},
{id:"4-8",term:"협업 기반: 사용자 스토리·인수 조건·ATDD",easy:"사용자 스토리 3C: Card(카드에 적은 짧은 설명), Conversation(대화로 구체화), Confirmation(인수 조건으로 확인).\n좋은 스토리 INVEST: 독립적, 협상 가능, 가치 있음, 추정 가능, 작음, 테스트 가능(Testable).\n인수 조건 작성 형식: 시나리오형(Given/When/Then), 규칙형(체크리스트, 입출력 표).\nATDD: 인수 조건에서 테스트를 먼저 만들고, 긍정 테스트부터 작성.",game:"'유저로서 / 친구에게 판돈을 선물하고 싶다 / 그래야 같이 놀 수 있으니까' → 사용자 스토리.",tip:"3C의 세 번째 C는 Confirmation(확인)."}
]},
{n:5,t:"테스트 활동 관리",q:9,c:[
{id:"5-1",term:"테스트 계획서",easy:"테스트의 목표, 범위, 접근법, 일정, 예산, 자원, 리스크, 시작·종료 조건, 의사소통 방법 등을 적는 문서입니다.\n애자일에서는 테스터가 릴리스 계획(제품 전체 출시 단위)과 이터레이션 계획(1~4주 짧은 주기)에 참여합니다.",game:"분기 업데이트 QA 계획서에 '검증 범위, QA 기간, 투입 인원, 출시 기준'을 적는 것.",tip:"'결함 하나하나의 상세 재현 절차'는 계획서가 아니라 결함 보고서 내용."},
{id:"5-2",term:"시작 조건과 종료 조건",easy:"시작 조건(Entry): 테스트를 시작하기 위한 전제. 예: 테스트 환경 준비, 테스트 가능한 요구사항, 도구 준비.\n종료 조건(Exit): 테스트를 끝내도 되는 기준. 예: 커버리지 목표 달성, 미해결 결함 수 기준 충족, 계획된 테스트 실행 완료.\n애자일에서는 종료 조건 = 완료 정의(DoD), 시작 조건 = 준비 정의(DoR).",game:"'치명 버그 0건, 주요 버그 3건 이하면 출시 가능' → 종료 조건.",tip:"DoD = 끝 (Done), DoR = 시작 (Ready)."},
{id:"5-3",term:"테스트 노력 추정 4가지",easy:"비율 기반: 과거 비율 이용 (예: 개발 대비 테스트 노력 비율).\n외삽: 지금까지 진행된 데이터로 앞으로를 예측.\n와이드밴드 델파이: 전문가들이 각자 추정 → 차이 논의 → 다시 추정 (플래닝 포커가 이 방식).\n3점 추정: 낙관(a), 가장 가능성 높음(m), 비관(b)\n  추정치 E = (a + 4m + b) ÷ 6\n  표준편차 = (b − a) ÷ 6",game:"낙관 6일, 보통 9일, 비관 18일 → (6 + 36 + 18) ÷ 6 = 10일.",tip:"3점 추정 공식은 무조건 외우세요. 계산 문제 나옵니다."},
{id:"5-4",term:"테스트 케이스 우선순위",easy:"리스크 기반: 리스크가 높은 것부터.\n커버리지 기반: 커버리지를 가장 많이 올리는 것부터.\n요구사항 기반: 이해관계자가 정한 요구사항 우선순위대로.\n단, 의존 관계(먼저 해야 하는 TC)가 있으면 그 순서를 지켜야 합니다.",game:"'결제·정산'을 '설정 화면 문구'보다 먼저 테스트 → 리스크 기반.",tip:""},
{id:"5-5",term:"테스트 피라미드와 테스팅 사분면",easy:"테스트 피라미드: 아래층일수록 작고 빠르고 많은 테스트(단위 테스트), 위로 갈수록 크고 느리고 적은 테스트(UI·전체 흐름).\n테스팅 사분면 (애자일):\nQ1 기술 관점·팀 지원: 컴포넌트, 컴포넌트 통합 테스트 (자동화)\nQ2 비즈니스 관점·팀 지원: 기능 테스트, 사용자 스토리 테스트, 예시\nQ3 비즈니스 관점·제품 비평: 탐색적, 사용성, 사용자 인수 테스트\nQ4 기술 관점·제품 비평: 스모크, 비기능 테스트(사용성 제외)",game:"새 UI 사용성 체험 테스트 → Q3.",tip:"탐색적·사용성 → Q3, 성능·보안 → Q4."},
{id:"5-6",term:"리스크 관리",easy:"리스크 수준 = 발생 가능성 × 영향.\n프로젝트 리스크: 프로젝트 진행에 대한 리스크 (일정 지연, 인력 부족, 환경 지연).\n제품 리스크: 제품 품질에 대한 리스크 (기능 오류, 보안 취약점, 성능 저하).\n리스크 분석 = 식별 + 평가. 리스크 통제 = 완화 + 모니터링.\n대응: 테스트로 완화, 수용, 전가(보험·외주 등 남에게 넘김), 비상 계획.",game:"'결제 금액 오류로 유저 손해' → 제품 리스크.\n'QA 인원 2명 퇴사' → 프로젝트 리스크.",tip:"사람·일정·환경 = 프로젝트 리스크, 제품 결함 = 제품 리스크."},
{id:"5-7",term:"모니터링·제어와 보고서",easy:"모니터링: 진행 상황을 데이터로 지켜봄 (지표: 실행률, 통과율, 결함 수, 커버리지 등).\n제어: 계획과 어긋나면 조정 (우선순위 변경, 일정 조정, 환경 재확인).\n테스트 진행 보고서: 테스트 기간 중 정기적으로.\n테스트 완료 보고서: 테스트(레벨·이터레이션·프로젝트)가 끝날 때.",game:"매일 오후 QA 진행률 공유 → 진행 보고서.\n업데이트 출시 후 최종 QA 결과서 → 완료 보고서.",tip:""},
{id:"5-8",term:"형상 관리",easy:"테스트 대상(빌드)과 테스트웨어의 '버전'을 구분하고 추적하는 것입니다.\n어떤 빌드에 어떤 TC 버전으로 테스트했는지 알 수 있어야 결과를 재현할 수 있습니다.",game:"'1.2.3 빌드에서 재현됨, 1.2.4에서 수정 확인'처럼 빌드 번호를 기록하는 것.",tip:""},
{id:"5-9",term:"결함 관리와 결함 보고서",easy:"결함 보고서에 들어가는 것:\n• 고유 ID, 제목, 날짜, 작성자\n• 테스트 대상과 환경(빌드, 기기)\n• 재현 단계\n• 기대 결과와 실제 결과\n• 심각도, 우선순위\n• 상태 (열림, 수정됨, 종료 등)\n• 로그·스크린샷 등 증거\n목적: 개발자가 재현·수정할 수 있게 충분한 정보 제공, 품질 추적, 프로세스 개선 근거.",game:"팀장님이 매일 쓰시는 그 버그 리포트입니다.",tip:"'결함을 만든 개발자 처벌 기록'은 보고서 목적이 아닙니다."}
]},
{n:6,t:"테스트 도구",q:2,c:[
{id:"6-1",term:"테스트 도구 종류",easy:"관리 도구: 요구사항, 테스트, 결함, 형상 관리 (예: 지라 같은 이슈 관리).\n정적 테스팅 도구: 코드를 실행하지 않고 검사 (정적 분석).\n테스트 설계·구현 도구: 테스트 케이스·데이터 생성.\n테스트 실행·커버리지 도구: 자동 실행, 커버리지 측정.\n비기능 테스트 도구: 성능·부하 등 사람이 하기 어려운 테스트.\nDevOps 도구: 자동 빌드·배포 파이프라인.\n협업 도구: 소통.\n확장성·배포 표준화 도구: 가상 머신, 컨테이너.",game:"버그 트래커 = 관리 도구. 부하 테스트 도구 = 비기능 도구.",tip:"6장은 2문제뿐. 가볍게."},
{id:"6-2",term:"자동화의 이점과 리스크",easy:"이점: 반복 작업 시간 절약, 사람 실수 감소·일관성, 객관적인 측정, 빠른 피드백, 사람이 못하는 테스트(대량 부하) 가능.\n리스크: 비현실적인 기대, 도입·유지 노력 과소평가, 도구에 지나친 의존(사람 판단 무시), 벤더 의존(회사 폐업 등), 오픈소스 지원 중단, 기존 플랫폼과 안 맞음.",game:"'자동화 도구만 사면 QA 인원이 필요 없다' → 비현실적 기대 (리스크).",tip:""}
]}
];

const FIELDS=[["베팅 금액","원"],["닉네임 길이","자"],["캐릭터 레벨",""],["가입 나이","세"],["보유 코인","개"],["주문 수량","개"]];

function tiersOf(k){const lo=pick([0,1,2,5,10,14,100]);let s=lo,t=[];for(let i=0;i<k;i++){const w=rint(4,30)*(lo>=100?10:1);t.push([s,s+w-1]);s+=w}return t}
function genEP(){
  const [f,u]=pick(FIELDS);const k=rint(1,3);const t=tiersOf(k);const capped=k===1||Math.random()<.5;
  const names=["보상 없음","일반 보상","특별 보상"];
  let desc=k===1?`${f} 값은 정수이며 ${t[0][0]}~${t[0][1]}${u}만 허용하고, 그 밖의 값은 거부한다.`:
    `${f} 값은 정수로 입력한다. `+t.map((r,i)=>i===k-1&&!capped?`${r[0]}${u} 이상은 '${names[i]}'`:`${r[0]}~${r[1]}${u}는 '${names[i]}'`).join(", ")+`. ${t[0][0]}${u}보다 작은 값은 거부한다.`+(capped?` ${t[k-1][1]}${u}보다 큰 값도 거부한다.`:"");
  const ans=k+1+(capped?1:0);
  const parts=[`${t[0][0]-1}${u} 이하(비유효)`].concat(t.map((r,i)=>i===k-1&&!capped?`${r[0]}${u} 이상`:`${r[0]}~${r[1]}${u}`)).concat(capped?[`${t[k-1][1]+1}${u} 이상(비유효)`]:[]);
  return G("ep",Object.assign(mkOpts(ans+"개",[(ans-1)+"개",(ans+1)+"개",(ans+2)+"개"]),{q:desc+" 동등 분할로 모든 파티션을 커버하려면 최소 몇 개의 테스트가 필요한가?",e:`파티션: ${parts.join(" / ")} → ${ans}개. 파티션마다 대표값 하나씩이면 됩니다.`}));
}
function bvaVals(t,m){const v=new Set();t.forEach(([s,e])=>{(m===2?[s-1,s,e,e+1]:[s-1,s,s+1,e-1,e,e+1]).forEach(x=>v.add(x))});return[...v].sort((a,b)=>a-b)}
function genBVA(){
  const [f,u]=pick(FIELDS);const m=rint(2,3);const k=Math.random()<.6?1:2;const t=tiersOf(k);
  const vals=bvaVals(t,m);
  const rangeTxt=k===1?`${t[0][0]}~${t[0][1]}${u}만 허용(정수)`:`${t[0][0]}~${t[0][1]}${u}는 A등급, ${t[1][0]}~${t[1][1]}${u}는 B등급, 그 밖은 거부(정수)`;
  const e=`${m}값 경계값은 각 경계에서 ${m===2?"경계값과 바로 바깥 이웃":"경계값과 양쪽 이웃"}을 씁니다. 테스트 값: ${vals.join(", ")} → ${vals.length}개.`;
  if(k===1&&Math.random()<.5){
    const [lo,hi]=t[0];const fmt=a=>a.join(", ");
    const two=fmt([lo-1,lo,hi,hi+1]),three=fmt([lo-1,lo,lo+1,hi-1,hi,hi+1]);
    return G("bva",Object.assign(mkOpts(m===2?two:three,[m===2?three:two,fmt([lo,hi]),fmt([lo,lo+1,hi-1,hi]),fmt([lo-2,lo-1,hi+1,hi+2])]),{q:`${f}: ${rangeTxt}. ${m}값 경계값 분석으로 테스트할 값으로 옳은 것은?`,e}));
  }
  const n=vals.length;
  return G("bva",Object.assign(mkOpts(n+"개",[(n-2)+"개",(n+2)+"개",(n+4)+"개",(n*2)+"개"]),{q:`${f}: ${rangeTxt}. ${m}값 경계값 분석을 적용할 때 필요한 서로 다른 테스트 값은 몇 개인가?`,e}));
}
function genDT(){
  const pool=shuffle(["VIP 회원인가","이벤트 기간인가","첫 결제인가","친구 초대 코드가 있는가","출석 7일 이상인가"]);
  let n,ans,q,e;
  if(Math.random()<.65){n=rint(2,5);ans=2**n;const c=pool.slice(0,n);q=`보상 지급 규칙의 조건이 ${n}개다: ${c.map(x=>"'"+x+"'").join(", ")} (각각 예/아니오). 축약하지 않은 전체 결정 테이블의 열(규칙) 수는?`;e=`조건마다 2가지 값 → 2를 ${n}번 곱합니다. 2^${n} = ${ans}.`}
  else{n=rint(1,3);ans=3*2**n;const c=pool.slice(0,n);q=`조건이 '회원 등급(일반/실버/골드)'과 ${c.map(x=>"'"+x+"'").join(", ")}(각각 예/아니오)이다. 축약하지 않은 전체 결정 테이블의 열 수는?`;e=`등급 3가지 × 예/아니오 조건 ${n}개(2^${n}) = 3 × ${2**n} = ${ans}.`}
  return G("dt",Object.assign(mkOpts(ans+"열",[(ans/2)+"열",(ans*2)+"열",(ans-1)+"열",(n+1)*2+"열"]),{q,e}));
}
function genCov(){
  const kinds=[["구문","실행 가능한 구문","4-6"],["분기","분기","4-6"],["동등 분할","파티션","4-2"],["유효 전이","유효 전이","4-5"]];
  const [nm,unit,kk]=pick(kinds);let T,E;
  do{T=pick([4,5,8,10,12,16,20,25,40,50]);E=rint(1,T-1)}while((E*100)%T!==0);
  const p=E*100/T;const near=[Math.round((E-1)*100/T),Math.round((E+1)*100/T),Math.round((T-E)*100/T),Math.round(E*100/(T+E))];
  const r=G("cov",Object.assign(mkOpts(p+"%",near.filter(x=>x!==p).map(x=>x+"%").concat([(p+5)+"%",(p-5)+"%"])),{q:`테스트 대상에 ${unit}이(가) 총 ${T}개 있다. 테스트를 실행해 그중 ${E}개를 커버했다. ${nm} 커버리지는?`,e:`커버리지 = 커버한 개수 ÷ 전체 개수 = ${E} ÷ ${T} = ${p}%.`}));r.k=kk;return r;
}
function genBr(){

function genTP(){

function statKey(q){return q.gen?"g:"+q.gen:q.id}
function record(q,ok,fromWrong){
  if(q.term){const l=S.terms[q.tid]||0;S.terms[q.tid]=ok?Math.min(3,Math.max(l,1)+1):1;bump();save();return}
  const k=statKey(q);const s=S.stats[k]||(S.stats[k]={c:0,w:0});ok?s.c++:s.w++;
  if(!q.gen){if(!ok)S.wrong[q.id]=1;else if(fromWrong)delete S.wrong[q.id]}
  bump();save();
}
function chAcc(n){let c=0,t=0;Object.entries(S.stats).forEach(([k,s])=>{const ch=k.startsWith("g:")?GEN[k.slice(2)]&&GEN[k.slice(2)].ch:(qById(k)||{}).ch;if(ch===n){c+=s.c;t+=s.c+s.w}});return{c,t,p:t?Math.round(c/t*100):null}}
function allAcc(){let c=0,t=0;Object.values(S.stats).forEach(s=>{c+=s.c;t+=s.c+s.w});return t?c/t:null}
const termTotal=()=>TERMS.length, termDone=()=>TERMS.filter(t=>S.terms[t[0]]===3).length;
const conceptTotal=()=>CH.reduce((s,c)=>s+c.c.length,0);
function readiness(){

/* ===================== 매일 알림 (앱 전용) ===================== */
function notifyHTML(){
  return `<section class="card stack tight">
    <div class="row between"><h3>매일 공부 알림</h3><label class="switch"><input type="checkbox" id="notifyOn" ${S.notify.on?"checked":""}><span></span></label></div>
    <div class="row between"><span class="small muted">${S.notify.on?"매일 이 시간에 알려 드려요":"켜면 매일 정한 시간에 알림이 와요"}</span><input type="time" id="notifyTime" value="${esc(S.notify.time)}" aria-label="알림 시간"></div>
  </section>`;
}
async function applyNotify(ask){
  if(!native())return;
  const LN=window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;if(!LN)return;
  try{
    await LN.cancel({notifications:[{id:1}]}).catch(()=>{});
    if(!S.notify.on)return;
    let p=await LN.checkPermissions();
    if(p.display!=="granted"&&ask)p=await LN.requestPermissions();
    if(p.display!=="granted"){if(ask){S.notify.on=false;save();render();toast("알림 권한이 없어요. 폰 설정 → 앱 → 합격노트에서 알림을 허용해 주세요")}return}
    const [h,m]=S.notify.time.split(":").map(Number);const st=streak();const d=ddays();
    const body=(d!==null&&d>0?`시험까지 D-${d}. `:"")+(st?`${st}일 연속 공부 중! `:"")+`오늘 목표 ${S.goal}개를 채워 볼까요?`;
    await LN.schedule({notifications:[{id:1,title:"합격노트 공부 시간이에요",body,schedule:{on:{hour:h,minute:m}},smallIcon:"ic_stat_note",iconColor:"#E5405E"}]});
    if(ask)toast(`매일 ${S.notify.time}에 알려 드릴게요`);
  }catch(e){if(ask)toast("알림을 설정하지 못했어요")}
}

  let ts=TERMS.filter(t=>!termCh||t[1]===termCh);

  const order=l=>l===1?0:l===undefined?1:l===2?2:3;
  ts=shuffle(ts).sort((a,b)=>order(S.terms[a[0]])-order(S.terms[b[0]]));
  T={deck:ts.map(t=>t[0]),i:0,on:false,res:{1:0,2:0,3:0}};
}

const MODES=[
 ["all","전체 문제","장 선택 가능"],
 ["new","안 푼 문제","처음 보는 것만"],
 ["weak","약점 공략","정답률 낮은 장 + 오답"],
 ["calc","계산 문제 무한","숫자가 매번 바뀌어요"],
 ["multi","2개 고르기","실제 시험에 나오는 형식"],
 ["star","별표 문제","표시해 둔 문제"],
 ["wrong","오답만","맞히면 오답노트에서 빠짐"]

function weakChapter(){const w=CH.map(ch=>({n:ch.n,a:chAcc(ch.n)})).filter(x=>x.a.t>=4).sort((a,b)=>a.a.p-b.a.p)[0];return w?w.n:4}
function poolFor(mode){
  let p=Q.filter(q=>!pickCh||q.ch===pickCh);
  if(mode==="new")p=p.filter(q=>!S.stats[q.id]);
  if(mode==="multi")p=Q.filter(q=>isMulti(q));
  if(mode==="star")p=Q.filter(q=>S.star[q.id]);
  if(mode==="wrong")p=Q.filter(q=>S.wrong[q.id]);
  if(mode==="weak"){const wc=weakChapter();p=Q.filter(q=>q.ch===wc||S.wrong[q.id])}
  return p;
}

  <div class="top"><div><div class="label">모의고사 결과</div><h1>채점 완료</h1></div></div>
  <section class="card stack">
    <div class="row between"><span class="score">${M.score}<span class="small muted">/40</span></span><span class="stamp ${pass?"pass":"fail"}">${pass?"합격":"불합격"}</span></div>
    <p class="small muted">합격선 26개 · ${pass?"여유 "+(M.score-26)+"개":(26-M.score)+"개 더 맞히면 합격"}</p>
    <div class="chaps">${CH.map(ch=>{const b=M.by[ch.n]||{c:0,t:1};const p=Math.round(b.c/b.t*100);return `<div class="chap-line" style="${cvar(ch.n)}"><span class="dot">${ch.n}</span><span class="small">${esc(ch.t)}</span><span class="mono small">${b.c}/${b.t}</span><div class="track"><i style="width:${p}%"></i></div></div>`}).join("")}</div>
  </section>
  ${weakConceptsHTML(wrongs.map(x=>x.q.k))}
  ${wrongs.length?`<div class="label">틀린 문제 ${wrongs.length}개 · 고정 문제는 오답노트에 저장됨</div>${wrongs.map(({q,k})=>`<div class="qcard" style="${cvar(q.ch)}"><span class="badge">${k+1}번 · ${q.ch}장</span><p class="qtext">${hq(q.q)}</p>${q.code?`<pre class="code">${esc(q.code)}</pre>`:""}<p class="small">내 답: <b>${fmtAns(q,M.ans[k])}</b></p><p class="small" style="color:var(--ok)">정답: <b>${isMulti(q)?q.a.map(i=>L[i]+". "+esc(q.o[i])).join(" / "):L[q.a]+". "+esc(q.o[q.a])}</b></p><p class="small">${esc(q.e)}</p>${whysHTML(q,M.ans[k])}</div>`).join("")}`:`<div class="card"><h2>만점이에요!</h2></div>`}
  <button class="btn wide" id="newMock">새 모의고사 보기</button>
  </div>`;
}

/* ===================== 이벤트 ===================== */
function on(sel,fn){const el=$(sel);if(el)el.addEventListener("click",fn)}
function bind(){
  const d=$("#examDate");if(d)d.addEventListener("change",()=>{S.examDate=d.value;save();render();if(S.notify.on)applyNotify(false)});
  $$("[data-goal]").forEach(b=>b.addEventListener("click",()=>{S.goal=+b.dataset.goal;save();render()}));
  $$("[data-act]").forEach(b=>b.addEventListener("click",()=>{const a=b.dataset.act;
    if(a.startsWith("concept:"))goConcept(a.split(":")[1]);
    else if(a==="weak"){pMode="weak";P=null;go("practice")}
    else if(a==="calc"){pMode="calc";view="practice";startPractice();go("practice")}
    else if(a==="terms"){termTab="cards";T=null;go("terms")}
    else go(a)}));
  $$("[data-concept]").forEach(b=>b.addEventListener("click",()=>goConcept(b.dataset.concept)));
  $$("[data-ck]").forEach(c=>c.addEventListener("change",()=>{if(c.checked)S.check[c.dataset.ck]=1;else delete S.check[c.dataset.ck];save();const all=CHECK.flatMap(s=>s.items);$(".top .label").textContent=`시험 준비 · ${all.filter(i=>S.check[i[0]]).length}/${all.length}`}));
  const nOn=$("#notifyOn");if(nOn)nOn.addEventListener("change",()=>{S.notify.on=nOn.checked;save();applyNotify(true);if(!nOn.checked)toast("알림을 껐어요");render()});
  const nT=$("#notifyTime");if(nT)nT.addEventListener("change",()=>{if(!nT.value)return;S.notify.time=nT.value;save();if(S.notify.on)applyNotify(true)});
  const mb=$("#moreBox");if(mb)mb.addEventListener("toggle",()=>{backupOpen=mb.open});
  on("#copyBackup",()=>{const v=$("#exportBox").value;try{navigator.clipboard.writeText(v).then(()=>toast("백업 코드를 복사했어요"),()=>{$("#exportBox").select();toast("코드를 길게 눌러 복사하세요")})}catch(e){$("#exportBox").select();toast("코드를 길게 눌러 복사하세요")}});
  on("#importBtn",()=>{const v=$("#importBox").value.trim();if(!v){toast("백업 코드를 먼저 붙여넣으세요");return}try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(typeof o!=="object"||!o.stats)throw 0;S=Object.assign(def(),o,{live:null});save();M=null;P=null;T=null;toast("기록을 불러왔어요");render()}catch(e){toast("코드가 올바르지 않아요. 다시 복사해 보세요")}});
  on("#resetBtn",()=>{resetArm=true;render()});
  on("#resetNo",()=>{resetArm=false;render()});
  on("#resetYes",()=>{const n=S.notify;S=def();S.notify=n;save();resetArm=false;P=null;M=null;T=null;clearInterval(window._mt);toast("기록을 모두 지웠어요");render()});
  // 개념
  $$("details.chap").forEach(dt=>dt.addEventListener("toggle",()=>{if(dt.open)openCh=+dt.id.slice(4)}));
  $$("[data-read]").forEach(c=>c.addEventListener("change",()=>{const id=c.dataset.read;if(c.checked){S.read[id]=1;bump()}else delete S.read[id];save();c.closest(".concept").classList.toggle("done",c.checked);const det=c.closest("details");const ch=CH.find(x=>"chap"+x.n===det.id);det.querySelector("summary .badge").textContent=ch.c.filter(x=>S.read[x.id]).length+"/"+ch.c.length;if(c.checked&&ch.c.every(x=>S.read[x.id]))toast(ch.n+"장 개념 완료!")}));
  $$("[data-practice-ch]").forEach(b=>b.addEventListener("click",()=>{pickCh=+b.dataset.practiceCh;pMode="all";P=null;go("practice")}));
  $$("[data-kpractice]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.kpractice;const list=shuffle(Q.filter(q=>q.k===k));if(!list.length){toast("이 개념의 문제는 아직 없어요");return}view="practice";startPractice(list,{mode:"concept",fromWrong:false});go("practice")}));
  $$("[data-terms-ch]").forEach(b=>b.addEventListener("click",()=>{termCh=+b.dataset.termsCh;termTab="cards";T=null;go("terms")}));
  // 용어
  $$("[data-ttab]").forEach(b=>b.addEventListener("click",()=>{termTab=b.dataset.ttab;render()}));
  $$("[data-tch]").forEach(b=>b.addEventListener("click",()=>{termCh=+b.dataset.tch;T=null;render()}));
  const fl=()=>{T.on=!T.on;$("#flip").classList.toggle("on",T.on);$("#rateArea").hidden=!T.on;$("#flipBtn").hidden=T.on};
  on("#flip",fl);on("#flipBtn",fl);
  $$("[data-rate]").forEach(b=>b.addEventListener("click",()=>{const r=+b.dataset.rate;const id=T.deck[T.i];S.terms[id]=r;T.res[r]++;bump();save();
    if(r===1&&T.deck.length-T.i>3){T.deck.splice(Math.min(T.deck.length,T.i+4),0,id)}
    T.i++;T.on=false;render()}));
  on("#deckAgain",()=>{T=null;render()});
  on("#startTermQuiz",()=>termQuiz(false));
  on("#startTermQuiz2",()=>termQuiz(true));
  const ts=$("#tsearch");if(ts)ts.addEventListener("input",()=>{$("#tlist").innerHTML=termListHTML(ts.value)});
  // 문제
  $$("[data-mode]").forEach(b=>b.addEventListener("click",()=>{pMode=b.dataset.mode;render()}));
  $$("[data-pick]").forEach(b=>b.addEventListener("click",()=>{pickCh=+b.dataset.pick;render()}));
  $$("[data-len]").forEach(b=>b.addEventListener("click",()=>{pLen=+b.dataset.len;render()}));
  const tOn=$("#timedOn");if(tOn)tOn.addEventListener("change",()=>{S.timed=tOn.checked;save()});
  on("#startPractice",()=>startPractice());
  $$("[data-opt]").forEach(b=>b.addEventListener("click",()=>{if(P.pick!==null)return;const k=+b.dataset.opt;const q=P.list[P.i];
    if(isMulti(q)){const i=P.sel.indexOf(k);if(i>=0)P.sel.splice(i,1);else if(P.sel.length<q.a.length)P.sel.push(k);else{toast(`${q.a.length}개까지 고를 수 있어요`);return}
      b.classList.toggle("sel",P.sel.includes(k));const sb=$("#submitMulti");sb.disabled=P.sel.length!==q.a.length;sb.textContent=`${P.sel.length}/${q.a.length} 선택 · 채점하기`;return}
    answer(k)}));
  on("#submitMulti",()=>{const q=P.list[P.i];if(P.sel.length===q.a.length)answer(P.sel.slice().sort((a,b)=>a-b))});
  on("#starBtn",()=>{const q=P.list[P.i];if(S.star[q.id])delete S.star[q.id];else S.star[q.id]=1;save();const b=$("#starBtn");b.setAttribute("aria-pressed",!!S.star[q.id]);b.textContent=S.star[q.id]?"★ 별표됨":"☆ 별표"});
  on("#nextQ",()=>{P.i++;P.pick=null;P.sel=[];P.deadline=null;if(P.inf)P.list.push(genAny());render();window.scrollTo(0,0)});
  on("#endPractice",()=>{stopQTimer();const wasTerm=P&&P.mode==="term";const inf=P&&P.inf;const r=P?P.right:0,n=P?P.i+(P.pick!==null?1:0):0;P=null;if(inf&&n)toast(`계산 문제 ${n}개 중 ${r}개 정답`);if(wasTerm){go("terms")}else render()});
  on("#againPractice",()=>{if(P.mode==="term"){termQuiz(!!P.list[0].rev);return}const base=P.list.map(q=>q.gen?q:(qById(q.id)||q));const list=P.fromWrong?base.filter(q=>S.wrong[q.id]):base;startPractice(shuffle(list.length?list:base),{mode:P.mode,fromWrong:P.fromWrong})});
  $$("[data-wtab]").forEach(b=>b.addEventListener("click",()=>{wrongTab=b.dataset.wtab;render()}));
  on("#retryList",()=>{const src=wrongTab==="wrong"?S.wrong:S.star;const list=Object.keys(src).map(qById).filter(Boolean);view="practice";startPractice(shuffle(list),{mode:wrongTab,fromWrong:wrongTab==="wrong"});go("practice")});
  $$("[data-goto]").forEach(b=>b.addEventListener("click",()=>{P=null;go(b.dataset.goto)}));
  // 모의고사
  on("#startMock",startMock);
  $$("[data-mopt]").forEach(b=>b.addEventListener("click",()=>{const k=+b.dataset.mopt;const q=M.list[M.i];
    if(isMulti(q)){let a=Array.isArray(M.ans[M.i])?M.ans[M.i].slice():[];const i=a.indexOf(k);if(i>=0)a.splice(i,1);else if(a.length<q.a.length)a.push(k);else{toast(`${q.a.length}개까지 고를 수 있어요`);return}a.sort((x,y)=>x-y);if(a.length)M.ans[M.i]=a;else delete M.ans[M.i]}
    else M.ans[M.i]=k;
    save();render()}));
  on("#flagBtn",()=>{if(M.flag[M.i])delete M.flag[M.i];else M.flag[M.i]=1;save();render()});
  on("#prevM",()=>{M.i--;M.arm=false;render()});
  on("#nextM",()=>{M.i++;M.arm=false;render()});
  $$("[data-jump]").forEach(b=>b.addEventListener("click",()=>{M.i=+b.dataset.jump;render();window.scrollTo(0,0)}));
  on("#submitM",()=>{M.arm=true;render()});
  on("#submitNo",()=>{M.arm=false;render()});
  on("#submitYes",submitMock);
  on("#quitMock",()=>{clearInterval(window._mt);M=null;S.live=null;save();toast("모의고사를 그만뒀어요");render()});
  on("#newMock",()=>{M=null;render()});
}

/* ===================== 시작 ===================== */
if(S.live&&S.live.list&&!S.live.done){M=S.live;M.arm=false;if(Date.now()>=M.end){submitMock()}else startTimer()}
go(M&&!M.done?"mock":"home");
if(S.notify.on)setTimeout(()=>applyNotify(false),800);

</script>
<script>
(function(){try{var C=window.Capacitor;if(!C||!C.Plugins||!C.Plugins.App)return;
C.Plugins.App.addListener("backButton",function(){
 if(typeof M!=="undefined"&&M&&!M.done&&view==="mock"){toast("모의고사 중에는 '그만두기' 버튼을 눌러 주세요");return}
 if(typeof P!=="undefined"&&P&&view==="practice"){stopQTimer();P=null;render();return}
 if(view!=="home"){go("home");return}
 C.Plugins.App.exitApp();});}catch(e){}})();
</script>
</body>
</html>
