name: 안드로이드 앱 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 앱 재료 준비
        run: |
          mkdir -p www
          cp index.html manifest.json icon-192.png icon-512.png www/
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7
          cp node_modules/@capacitor/core/dist/capacitor.js www/
          npx cap add android
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/' android/variables.gradle
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do cp icon-512.png $d/$f.png; done
          done
          for f in $(find $RES -name splash.png); do cp splash.png $f; done
          npx cap sync android

      - name: 서명 열쇠 준비 (매번 같은 도장 찍기)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  fixed {
                      storeFile file("../../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixed
                  }
              }
          }
          GRADLE

      - name: APK 만들기
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: 완성품 보관함(Releases)에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk hapgyeok-note-1.${{ github.run_number }}.apk
          gh release create "v${{ github.run_number }}" hapgyeok-note-1.${{ github.run_number }}.apk \
            --title "합격노트 버전 1.${{ github.run_number }}" \
            --notes "폰에서 아래 hapgyeok-note-1.${{ github.run_number }}.apk를 눌러 받은 뒤 설치하세요."
